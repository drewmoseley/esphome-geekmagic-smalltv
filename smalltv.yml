esphome:
  name: geekmagic-smalltv-01
  friendly_name: geekmagic-smalltv-01
  platformio_options:
    board_build.f_cpu: 160000000L
  on_boot:
    - priority: 600
      then:
        - delay: 1s
        - output.turn_on: pwm_output
        - output.set_level:
            id: pwm_output
            level: 50%

esp8266:
  board: esp12e

external_components:
  - source:
      type: git
      url: https://github.com/lhartmann/esphome-st7789v-fractional-framebuffer
      ref: main
    refresh: 0s
    components: [st7789v]

# Enable logging
logger:

# Home Assistant API
api:
  # prevent reboots in case the connection to HA is lost or the device is used standalone
  reboot_timeout: 0s
#  encryption:
#    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: default_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      # workaround as there is no initial value for the icon sensor
      - lambda: id(wifi_signal_icon).publish_state("\U000F16BD"); // wifi check

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:
  id: my_portal

time:
  - platform: sntp
    id: sntp_time
    timezone: America/New_York
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org

font:
  - id: roboto_16
    file: "gfonts://Roboto"
    size: 16
  - id: terminus14n
    file: fonts/terminus-font-4.49.1/ter-u14n.bdf
  - id: roboto_22
    file: "gfonts://Roboto"
    size: 22
  - id: spleen64
    file:
      type: web
      url: https://raw.githubusercontent.com/fcambus/spleen/refs/heads/master/spleen-32x64.bdf
    glyphs: "0123456789:-"
  - id: icon_font_20
    file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    size: 20
    glyphs:
      - "\U000F0003" # mdi-access-point
      - "\U000F05A9" # mdi-wifi
      - "\U000F091F" # mdi-wifi-strength-1
      - "\U000F0922" # mdi-wifi-strength-2
      # - "\U000F0925" # mdi-wifi-strength-3 -- skipping to have a bigger step between 2 and full
      # - "\U000F0928" # mdi-wifi-strength-4 -- skipping as we use the wifi icon itself
      - "\U000F092B" # mdi-wifi-strength-alert-outline
      - "\U000F092E" # mdi-wifi-strength-off-outline
      - "\U000F16BD" # mdi-wifi-check
  - id: icon_font_64
    file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    size: 64
    glyphs:
      - "\U000F0599" # mdi-weather-sunny
      - "\U000F0594" # mdi-weather-night
      - "\U000F0590" # mdi-weather-cloudy
      - "\U000F0591" # mdi-weather-fog
      - "\U000F0592" # mdi-weather-hail
      - "\U000F0593" # mdi-weather-lightning
      - "\U000F067E" # mdi-weather-lightning-rainy
      - "\U000F0595" # mdi-weather-partly-cloudy
      - "\U000F0596" # mdi-weather-pouring
      - "\U000F0597" # mdi-weather-rainy
      - "\U000F0598" # mdi-weather-snowy
      - "\U000F067F" # mdi-weather-snowy-rainy
      - "\U000F059D" # mdi-weather-windy
      - "\U000F059E" # mdi-weather-windy-variant
      - "\U000F05D6" # mdi-alert-circle-outline (fallback/exceptional)

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_db
    on_value:
      # ---- Text sensor to expose the current WiFi status icon ----
      lambda: |-
        // computed current wifi status icon
        auto computed_icon = "";

        int8_t rssi = id(wifi_signal_db).state;

        // based on the logic in https://github.com/esphome/esphome/blob/7394cbf77329f3b5a035e5ce334c9ac0ae19818c/esphome/components/wifi/wifi_component.cpp#L417
        if (rssi >= -50) {
          computed_icon = "\U000F05A9"; // wifi icon (full)
        } else if (rssi >= -65) {
          computed_icon = "\U000F0922"; // 2 bars
        } else  if (rssi >= -85) {
          computed_icon = "\U000F091F"; // 1 bar
        } else {
          computed_icon = "\U000F092B"; // 0 bars with alert
        }

        // publish only on change
        if (id(wifi_signal_icon).state != computed_icon) {
          id(wifi_signal_icon).publish_state(computed_icon);
        }

  # ---- Room climate (page 2) ----
  - platform: homeassistant
    id: t_office
    entity_id: sensor.office_temp_humidity_temperature
  - platform: homeassistant
    id: h_office
    entity_id: sensor.office_temp_humidity_humidity
  - platform: homeassistant
    id: t_bathroom
    entity_id: sensor.bathroom_temp_humidity_temperature
  - platform: homeassistant
    id: h_bathroom
    entity_id: sensor.bathroom_temp_humidity_humidity
  - platform: homeassistant
    id: t_guest_bedroom
    entity_id: sensor.guest_bedroom_temp_humidity_temperature
  - platform: homeassistant
    id: h_guest_bedroom
    entity_id: sensor.guest_bedroom_temp_humidity_humidity
  - platform: homeassistant
    id: t_garage
    entity_id: sensor.garage_temp_humidity_temperature
  - platform: homeassistant
    id: h_garage
    entity_id: sensor.garage_temp_humidity_humidity
  - platform: homeassistant
    id: t_garage_attic
    entity_id: sensor.garage_attic_temp_humidity_temperature
  - platform: homeassistant
    id: h_garage_attic
    entity_id: sensor.garage_attic_temp_humidity_humidity
  - platform: homeassistant
    id: t_laundry
    entity_id: sensor.laundry_room_temp_humidity_temperature
  - platform: homeassistant
    id: h_laundry
    entity_id: sensor.laundry_room_temp_humidity_humidity
  - platform: homeassistant
    id: t_studio
    entity_id: sensor.studio_temp_humidity_temperature
  - platform: homeassistant
    id: h_studio
    entity_id: sensor.studio_temp_humidity_humidity
  - platform: homeassistant
    id: t_bar
    entity_id: sensor.bar_temp_humidity_temperature
  - platform: homeassistant
    id: h_bar
    entity_id: sensor.bar_temp_humidity_humidity

  # ---- Weather + thermostats (page 3) ----
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.home
    attribute: temperature
  - platform: homeassistant
    id: t_living_room
    entity_id: sensor.living_room_thermostat_current_temperature
  - platform: homeassistant
    id: t_master_bedroom
    entity_id: sensor.master_bedroom_thermostat_temperature
  - platform: homeassistant
    id: t_alana_living_room
    entity_id: sensor.alana_living_room_thermostat_current_temperature

  # ---- Energy (page 4) ----
  - platform: homeassistant
    id: house_load
    entity_id: sensor.sense_1000006644_energy
  - platform: homeassistant
    id: house_daily_kwh
    entity_id: sensor.sense_1000006644_daily_energy
  - platform: homeassistant
    id: always_on_power
    entity_id: sensor.always_on_power

  # ---- Homelab monitoring (page 5) ----
  - platform: homeassistant
    id: hc_down
    entity_id: sensor.hc_summary
    attribute: down_count
  - platform: homeassistant
    id: hc_late
    entity_id: sensor.hc_summary
    attribute: late_count
  - platform: homeassistant
    id: kuma_down
    entity_id: sensor.kuma_summary
    attribute: down_count
  - platform: homeassistant
    id: netalertx_new
    entity_id: sensor.netalertx_new

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      entity_category: diagnostic
  - platform: template
    id: wifi_signal_icon
    name: "WiFi Signal Strength Icon"
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home
  - platform: homeassistant
    id: mode_living_room
    entity_id: climate.living_room_thermostat
  - platform: homeassistant
    id: mode_master_bedroom
    entity_id: climate.master_bedroom_thermostat
  - platform: homeassistant
    id: mode_alana_living_room
    entity_id: climate.alana_living_room_thermostat
  - platform: homeassistant
    id: hc_state
    entity_id: sensor.hc_summary
  - platform: homeassistant
    id: kuma_state
    entity_id: sensor.kuma_summary

# ---- Globals to hold the tick ----
globals:
  - id: current_brightness
    type: float
    restore_value: no
    initial_value: '0.5'

image:
  - id: bg_image
    file: https://lcsvh.com/ironman.png
    type: rgb565
    resize: 240x240

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

output:
  - id: pwm_output
    platform: esp8266_pwm
    pin: GPIO05
    inverted: true
    frequency: 1000 Hz

light:
  - platform: monochromatic
    id: backlight
    output: pwm_output
    name: "Backlight"
    restore_mode: RESTORE_DEFAULT_ON

color:
  - id: color_ironman_red
    hex: eb1c24
  - id: color_ironman_yellow
    hex: fcb712
  - id: color_white
    hex: ffffff
  - id: color_blue
    hex: 3399ff
  - id: color_green
    hex: 33cc33

graph:
  - id: climate_graph
    duration: 3h
    width: 228
    height: 168
    x_grid: 1h
    y_grid: 5.0
    traces:
      - sensor: t_office
        line_type: SOLID
        color: color_blue
      - sensor: t_studio
        line_type: SOLID
        color: color_green
      - sensor: t_garage
        line_type: SOLID
        color: color_ironman_yellow
      - sensor: t_living_room
        line_type: SOLID
        color: color_ironman_red

interval:
  - interval: 8s
    then:
      - display.page.show_next: my_display
  - interval: 60s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            float brightness = 0.50; // default brightness
            if (now.hour < 1) {
              // it's past midnight, dim the backlight even more
              brightness = 0.10;
            } else if (now.hour < 3) {
              // it's in the middle of the night, dim the backlight even more
              brightness = 0.05;
            } else if (now.hour < 8) {
              // it's early, dim the backlight
              brightness = 0.10;
            } else if (now.hour < 10) {
              // it's not that early anymore, dim the backlight
              brightness = 0.20;
            } else if (now.hour > 22) {
              // it's late, dim the backlight
              brightness = 0.20;
            }

            float current = id(current_brightness);
            if (brightness != current) {
              // only update if changed
              id(pwm_output).set_level(brightness);
              id(current_brightness) = brightness;
              ESP_LOGD("display", "Adjusted backlight brightness from %.2f to %.2f", current, brightness);
            }
          }
  - interval: 5s
    then:
      - component.update: my_display

display:
  - id: my_display
    platform: st7789v
    model: custom
    spi_id: spihwd
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    fragmentation: 30
    dc_pin: GPIO00
    reset_pin: GPIO02
    eightbitcolor: False
    update_interval: never
    spi_mode: mode3
    data_rate: 40000000
    auto_clear_enabled: False
    pages:
      - id: page_clock
        lambda: |-
          // Store screen dimensions
          int W = it.get_width();
          int H = it.get_height();

          // Background image (also replaces autoclear)
          it.image(0, 0, id(bg_image), ImageAlign::TOP_LEFT);

          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            int hour12 = now.hour % 12;
            if (hour12 == 0) hour12 = 12;
            const char *ampm = now.hour < 12 ? "AM" : "PM";

            it.printf( +11,  12, id(spleen64),  id(color_ironman_red),    TextAlign::TOP_LEFT,     "%02d", hour12);
            it.printf(W-11,  12, id(spleen64),  id(color_ironman_yellow), TextAlign::TOP_RIGHT,    "%02d", now.minute);
            it.printf(W-11,  78, id(terminus14n), id(color_ironman_yellow), TextAlign::TOP_RIGHT,  "%s", ampm);
            it.printf(W-3, H-32, id(terminus14n), id(color_ironman_yellow), TextAlign::BOTTOM_RIGHT, "%02d-%02d", now.day_of_month, now.month);
          }

          // ---- WiFi status icon ----
          // compute wifi status icon based on connection state and signal strength
          auto wifi_status_color = id(color_ironman_yellow);
          auto wifi_status_icon = "";
          if (id(my_portal).is_active()) {
            wifi_status_icon = "\U000F0003"; // access point icon
          } else if (id(default_wifi).is_connected()) {
            // connected: use the current signal strength icon
            wifi_status_icon = id(wifi_signal_icon).state.c_str();
          } else {
              // not connected: show wifi off icon
              wifi_status_icon = "\U000F092E"; // wifi off icon
              wifi_status_color = id(color_ironman_red);
          }

          it.printf(W-3, H-7, id(icon_font_20), wifi_status_color, TextAlign::BOTTOM_RIGHT, wifi_status_icon);
          if (id(default_wifi).is_connected()) {
            it.printf(3, H-7, id(terminus14n), id(color_ironman_red), TextAlign::BOTTOM_LEFT, id(wifi_ip_address).state.c_str());
          }

      - id: page_climate
        lambda: |-
          it.fill(Color::BLACK);
          int W = it.get_width();
          it.printf(W/2, 4, id(roboto_16), id(color_white), TextAlign::TOP_CENTER, "Indoor Climate");

          int lx = 6;
          int ly = 24;
          int lstep = W / 4;
          it.printf(lx,           ly, id(terminus14n), id(color_blue),           TextAlign::TOP_LEFT, "Off %.0f", id(t_office).state);
          it.printf(lx+lstep,     ly, id(terminus14n), id(color_green),          TextAlign::TOP_LEFT, "Stu %.0f", id(t_studio).state);
          it.printf(lx+2*lstep,   ly, id(terminus14n), id(color_ironman_yellow), TextAlign::TOP_LEFT, "Gar %.0f", id(t_garage).state);
          it.printf(lx+3*lstep,   ly, id(terminus14n), id(color_ironman_red),    TextAlign::TOP_LEFT, "LR %.0f", id(t_living_room).state);

          it.graph(6, 44, id(climate_graph));

      - id: page_weather
        lambda: |-
          it.fill(Color::BLACK);
          int W = it.get_width();
          it.printf(W/2, 4, id(roboto_16), id(color_white), TextAlign::TOP_CENTER, "Weather");

          std::string cond = id(weather_condition).state;
          const char *icon = "\U000F05D6"; // fallback: alert-circle-outline
          auto weather_color = id(color_ironman_yellow);
          if (cond == "sunny") {
            icon = "\U000F0599"; weather_color = id(color_ironman_yellow);
          } else if (cond == "clear-night") {
            icon = "\U000F0594"; weather_color = id(color_white);
          } else if (cond == "partlycloudy") {
            icon = "\U000F0595"; weather_color = id(color_white);
          } else if (cond == "cloudy") {
            icon = "\U000F0590"; weather_color = id(color_white);
          } else if (cond == "fog") {
            icon = "\U000F0591"; weather_color = id(color_white);
          } else if (cond == "hail") {
            icon = "\U000F0592"; weather_color = id(color_blue);
          } else if (cond == "lightning") {
            icon = "\U000F0593"; weather_color = id(color_ironman_yellow);
          } else if (cond == "lightning-rainy") {
            icon = "\U000F067E"; weather_color = id(color_ironman_yellow);
          } else if (cond == "pouring") {
            icon = "\U000F0596"; weather_color = id(color_blue);
          } else if (cond == "rainy") {
            icon = "\U000F0597"; weather_color = id(color_blue);
          } else if (cond == "snowy") {
            icon = "\U000F0598"; weather_color = id(color_white);
          } else if (cond == "snowy-rainy") {
            icon = "\U000F067F"; weather_color = id(color_blue);
          } else if (cond == "windy") {
            icon = "\U000F059D"; weather_color = id(color_white);
          } else if (cond == "windy-variant") {
            icon = "\U000F059E"; weather_color = id(color_white);
          }

          it.printf(W/2, 22, id(icon_font_64), weather_color, TextAlign::TOP_CENTER, icon);
          it.printf(W/2, 88, id(spleen64), id(color_ironman_yellow), TextAlign::TOP_CENTER, "%.0f", id(weather_temp).state);

          int y = 160;
          int step = 24;
          it.printf(6, y, id(terminus14n), id(color_white), TextAlign::TOP_LEFT, "Living Rm");
          it.printf(W-6, y, id(terminus14n), id(color_blue), TextAlign::TOP_RIGHT, "%.0fF %s", id(t_living_room).state, id(mode_living_room).state.c_str());
          y += step;
          it.printf(6, y, id(terminus14n), id(color_white), TextAlign::TOP_LEFT, "Mstr Bdrm");
          it.printf(W-6, y, id(terminus14n), id(color_blue), TextAlign::TOP_RIGHT, "%.0fF %s", id(t_master_bedroom).state, id(mode_master_bedroom).state.c_str());
          y += step;
          it.printf(6, y, id(terminus14n), id(color_white), TextAlign::TOP_LEFT, "Alana LR");
          it.printf(W-6, y, id(terminus14n), id(color_blue), TextAlign::TOP_RIGHT, "%.0fF %s", id(t_alana_living_room).state, id(mode_alana_living_room).state.c_str());

      - id: page_energy
        lambda: |-
          it.fill(Color::BLACK);
          int W = it.get_width();
          it.printf(W/2, 4, id(roboto_16), id(color_white), TextAlign::TOP_CENTER, "Home Energy");

          int y = 60;
          int step = 40;
          it.printf(W/2, y, id(terminus14n), id(color_white), TextAlign::TOP_CENTER, "House Load");
          it.printf(W/2, y+18, id(spleen64), id(color_ironman_yellow), TextAlign::TOP_CENTER, "%.0f", id(house_load).state);
          y += step + 40;
          it.printf(W/2, y, id(terminus14n), id(color_white), TextAlign::TOP_CENTER, "Today's kWh");
          it.printf(W/2, y+18, id(terminus14n), id(color_green), TextAlign::TOP_CENTER, "%.1f kWh", id(house_daily_kwh).state);
          y += step;
          it.printf(W/2, y, id(terminus14n), id(color_white), TextAlign::TOP_CENTER, "Always On");
          it.printf(W/2, y+18, id(terminus14n), id(color_blue), TextAlign::TOP_CENTER, "%.0f W", id(always_on_power).state);

      - id: page_homelab
        lambda: |-
          it.fill(Color::BLACK);
          int W = it.get_width();
          it.printf(W/2, 4, id(roboto_16), id(color_white), TextAlign::TOP_CENTER, "Homelab");

          int y = 32;
          int step = 72;

          int n_hc_down = (int) id(hc_down).state;
          int n_hc_late = (int) id(hc_late).state;
          auto hc_color = id(color_green);
          if (n_hc_down > 0) hc_color = id(color_ironman_red);
          else if (n_hc_late > 0) hc_color = id(color_ironman_yellow);
          it.printf(6, y, id(roboto_22), id(color_white), TextAlign::TOP_LEFT, "Healthchecks");
          it.printf(6, y+28, id(roboto_22), hc_color, TextAlign::TOP_LEFT, "%d down / %d late", n_hc_down, n_hc_late);
          y += step;

          int n_kuma_down = (int) id(kuma_down).state;
          auto kuma_color = n_kuma_down > 0 ? id(color_ironman_red) : id(color_green);
          it.printf(6, y, id(roboto_22), id(color_white), TextAlign::TOP_LEFT, "Kuma");
          it.printf(6, y+28, id(roboto_22), kuma_color, TextAlign::TOP_LEFT, "%d down", n_kuma_down);
          y += step;

          int n_na_new = (int) id(netalertx_new).state;
          auto na_color = n_na_new > 0 ? id(color_ironman_yellow) : id(color_green);
          it.printf(6, y, id(roboto_22), id(color_white), TextAlign::TOP_LEFT, "NetAlertX");
          it.printf(6, y+28, id(roboto_22), na_color, TextAlign::TOP_LEFT, "%d new device%s", n_na_new, n_na_new == 1 ? "" : "s");
